name: Validate corpus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Validate corpus (schema + taal arithmetic + note sets)
        run: python tools/validate.py

  reproducible:
    name: Derived files are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate text + MIDI + MusicXML from the canonical JSON
        run: |
          python tools/render_text.py
          python tools/to_midi.py
          python tools/to_musicxml.py

      - name: Fail if the committed derived files differ from what the tools produce
        run: |
          if ! git diff --quiet -- data/text derived; then
            echo "::error::Derived files are out of sync with data/songs/."
            echo "Regenerate and commit them:"
            echo "  python tools/render_text.py && python tools/to_midi.py && python tools/to_musicxml.py"
            echo ""
            echo "The generators are deterministic (tools/to_musicxml.py normalises music21's"
            echo "encoding date, version stamp and random part ids), so a diff here means the"
            echo "canonical data in data/songs/ changed without its derived views being rebuilt."
            git diff --stat -- data/text derived
            git diff -- data/text derived | head -60
            exit 1
          fi
          echo "Derived files match the canonical data."
